name = "hex-gfq-mathlib"
defaultTargets = ["HexGFqMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGFq"
git = "https://github.com/leanprover/hex-gfq.git"
rev = "41295c559a2848c9a9536d6e1527d45b2335e810"

[[require]]
name = "HexGF2Mathlib"
git = "https://github.com/leanprover/hex-gf2-mathlib.git"
rev = "dd1261bd2e0b843c9d631d1af08ef5accac45acf"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "HexGFqMathlib"
